<h1>Project Spoonbill: UI walkthrough</h1>
<p class="note">Recorded on synthetic fixture data, not real satellite results.</p>
<figure><figcaption>Captioned video of the full demo path</figcaption>
<video src="walkthrough.webm" controls muted playsinline></video></figure>
<figure><figcaption><b>1.</b> Project Spoonbill: satellite screening of Deep Bay wetland change (fixture data)</figcaption><img src="01_landing_overview.png" alt="Project Spoonbill: satellite screening of Deep Bay wetland change (fixture data)" loading="lazy"></figure>
<figure><figcaption><b>2.</b> Hover shows ID, tier, area and indicative zoning</figcaption><img src="02_map_hover_tooltip.png" alt="Hover shows ID, tier, area and indicative zoning" loading="lazy"></figure>
<figure><figcaption><b>3.</b> Click a polygon to open its detail panel</figcaption><img src="03_map_click_selected.png" alt="Click a polygon to open its detail panel" loading="lazy"></figure>
